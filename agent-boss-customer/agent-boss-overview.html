<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Boss for Your Organization — A Learning & Transformation Engine</title>
<style>
:root{
  --blue:#2b8fff; --blue2:#0078D4; --cyan:#37e6c9;
  --red:#E7556A; --green:#3DD68C; --gold:#F5C24B; --purple:#B58Cff;
  --ink:#06090f; --pad-x:92px; --pad-y:64px;
  --t-on:#ffffff; --t-mut:rgba(255,255,255,.62); --t-dim:rgba(255,255,255,.4);
  --line:rgba(255,255,255,.12); --card:rgba(255,255,255,.045);
  --font:"Segoe UI",-apple-system,Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#000;height:100%;font-family:var(--font);}
#stage{position:fixed;inset:0;background:#000;overflow:hidden;}
.slide{position:absolute;top:50%;left:50%;width:1280px;height:720px;
  transform:translate(-50%,-50%) scale(var(--fit,1));transform-origin:center;
  color:var(--t-on);overflow:hidden;display:none;}
.slide.active{display:block;}
.bg{position:absolute;inset:0;background:
  radial-gradient(120% 90% at 16% 8%, #16305e 0%, rgba(22,48,94,0) 55%),
  radial-gradient(120% 95% at 88% 92%, #2a1a4d 0%, rgba(42,26,77,0) 55%),
  linear-gradient(162deg,#070b16 0%,#0b1226 60%,#0a1830 100%);}
.mesh{position:absolute;inset:-20%;background:radial-gradient(40% 40% at 50% 50%,rgba(124,92,255,.16),transparent 70%);
  filter:blur(22px);opacity:0;}
.slide.active .mesh{opacity:1;animation:drift 12s ease-in-out infinite alternate;}
@keyframes drift{from{transform:translate(-5%,-3%) scale(1);}to{transform:translate(5%,4%) scale(1.12);}}
.pad{position:absolute;inset:0;padding:var(--pad-y) var(--pad-x);display:flex;flex-direction:column;}
.eyebrow{font-size:16px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--t-dim);}
.foot{position:absolute;left:var(--pad-x);bottom:32px;font-size:13px;color:var(--t-dim);}
.pageno{position:absolute;right:30px;bottom:22px;font-size:12px;font-weight:600;color:var(--t-dim);
  font-variant-numeric:tabular-nums;letter-spacing:.04em;z-index:50;}
.brandbar{position:absolute;right:var(--pad-x);top:var(--pad-y);display:flex;align-items:center;gap:9px;font-size:13px;color:var(--t-dim);font-weight:600;}
.logo4{width:18px;height:18px;display:grid;grid-template-columns:1fr 1fr;gap:2px;}
.logo4 i{display:block;border-radius:1px;}
.logo4 i:nth-child(1){background:#F25022;}.logo4 i:nth-child(2){background:#7FBA00;}
.logo4 i:nth-child(3){background:#00A4EF;}.logo4 i:nth-child(4){background:#FFB900;}

.r{opacity:0;}
.slide.active .r{animation:rise .62s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s);}
@keyframes rise{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:none;}}
.kw{background:linear-gradient(96deg,var(--cyan),var(--purple) 78%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}

/* COVER */
.cv-title{font-size:72px;font-weight:850;line-height:1.0;letter-spacing:-.03em;max-width:17ch;margin-top:auto;}
.cv-sub{font-size:22px;color:var(--t-mut);margin-top:24px;max-width:50ch;line-height:1.45;}
.cv-meta{display:flex;gap:42px;margin-top:40px;}
.cv-meta .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--t-dim);}
.cv-meta .v{font-size:17px;font-weight:600;margin-top:4px;}

/* generic heads */
.kick{font-size:15px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);}
.s-title{font-size:42px;font-weight:850;letter-spacing:-.022em;line-height:1.04;}
.s-sub{font-size:20px;color:var(--t-mut);margin-top:14px;max-width:62ch;line-height:1.46;}
.rule{width:64px;height:4px;background:var(--accent);border-radius:3px;margin:20px 0;}

/* THESIS two-col */
.shift{display:grid;grid-template-columns:1fr 66px 1fr;align-items:center;gap:8px;margin:auto 0;}
.shift-col{border-radius:18px;padding:34px 32px;min-height:228px;display:flex;flex-direction:column;justify-content:center;}
.shift-col.from{background:rgba(255,255,255,.05);border:1px solid var(--line);}
.shift-col.to{background:linear-gradient(180deg,rgba(124,92,255,.16),rgba(124,92,255,.04));border:1px solid rgba(124,92,255,.4);box-shadow:0 24px 60px -24px rgba(124,92,255,.5);}
.shift-era{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px;}
.shift-col.from .shift-era{color:var(--t-dim);}
.shift-col.to .shift-era{color:var(--purple);}
.shift-txt{font-size:26px;font-weight:700;line-height:1.24;letter-spacing:-.01em;}
.shift-col.from .shift-txt{color:rgba(255,255,255,.66);}
.shift-arrow{font-size:44px;font-weight:800;color:var(--purple);text-align:center;}

/* 3 PILLARS */
.pil{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px;margin-top:34px;flex:1;}
.pcard{border-radius:18px;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--pc);
  padding:30px 26px;display:flex;flex-direction:column;opacity:0;}
.slide.active .pcard{animation:rise .6s ease both;}
.slide.active .pcard:nth-child(1){animation-delay:.3s;}.slide.active .pcard:nth-child(2){animation-delay:.46s;}.slide.active .pcard:nth-child(3){animation-delay:.62s;}
.pc-step{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--pc);}
.pc-h{font-size:28px;font-weight:850;letter-spacing:-.01em;margin-top:14px;}
.pc-b{font-size:16.5px;color:var(--t-mut);line-height:1.5;margin-top:14px;}
.pc-tag{margin-top:auto;padding-top:18px;font-size:13.5px;font-weight:700;color:var(--pc);}

/* PROOF agent cards */
.ag-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px;flex:1;}
.agc{border-radius:16px;background:var(--card);border:1px solid var(--line);padding:24px 26px;display:flex;flex-direction:column;gap:8px;opacity:0;position:relative;}
.slide.active .agc{animation:rise .55s ease both;}
.slide.active .agc:nth-child(1){animation-delay:.3s;}.slide.active .agc:nth-child(2){animation-delay:.44s;}
.slide.active .agc:nth-child(3){animation-delay:.58s;}.slide.active .agc:nth-child(4){animation-delay:.72s;}
.agc .lbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);}
.agc.soon .lbl{color:var(--gold);}
.agc .nm{font-size:23px;font-weight:800;letter-spacing:-.01em;}
.agc .ds{font-size:15.5px;color:var(--t-mut);line-height:1.45;}

/* PROOF bento (registry: bento-grid-hero) — hero claim + agent evidence tiles */
.pbento{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:16px;margin-top:28px;flex:1;}
.pbt{border-radius:16px;background:var(--card);border:1px solid var(--line);padding:22px 24px;display:flex;flex-direction:column;gap:7px;opacity:0;position:relative;overflow:hidden;}
.slide.active .pbt{animation:rise .55s ease both;}
.slide.active .pbt:nth-child(1){animation-delay:.28s;}.slide.active .pbt:nth-child(2){animation-delay:.42s;}
.slide.active .pbt:nth-child(3){animation-delay:.56s;}.slide.active .pbt:nth-child(4){animation-delay:.7s;}.slide.active .pbt:nth-child(5){animation-delay:.84s;}
.pbt.hero{grid-row:span 2;background:linear-gradient(160deg,rgba(55,230,201,.16),rgba(43,143,255,.05));border:1px solid rgba(55,230,201,.42);box-shadow:0 30px 80px -42px rgba(55,230,201,.5);justify-content:center;}
.pbt .lbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);}
.pbt.soon .lbl{color:var(--gold);}
.pbt .nm{font-size:20px;font-weight:800;letter-spacing:-.01em;}
.pbt .ds{font-size:14px;color:var(--t-mut);line-height:1.42;}
.pbt.hero .he{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);}
.pbt.hero .hn{font-size:54px;font-weight:850;letter-spacing:-.03em;line-height:1;margin-top:10px;color:#fff;}
.pbt.hero .hb{font-size:16px;color:var(--t-mut);line-height:1.5;margin-top:14px;}

/* 12 BLOCKS / 3 PHASES */
.ph-wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:28px;flex:1;}
.ph{display:flex;flex-direction:column;opacity:0;}
.slide.active .ph{animation:rise .6s ease both;}
.slide.active .ph:nth-child(1){animation-delay:.3s;}.slide.active .ph:nth-child(2){animation-delay:.5s;}.slide.active .ph:nth-child(3){animation-delay:.7s;}
.ph-head{border-radius:13px;padding:14px 18px;border:1px solid var(--ph);border-left-width:4px;
  background:color-mix(in srgb,var(--ph) 12%,transparent);margin-bottom:13px;}
.ph-n{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ph);}
.ph-t{font-size:20px;font-weight:850;letter-spacing:-.01em;margin-top:3px;}
.ph-blocks{display:flex;flex-direction:column;gap:12px;flex:1;justify-content:space-between;}
.blk{display:grid;grid-template-columns:30px 1fr;gap:11px;align-items:center;flex:1;
  border-radius:10px;background:var(--card);border:1px solid var(--line);padding:14px 14px;}
.blk .bn{font-size:13px;font-weight:850;color:var(--ph);font-variant-numeric:tabular-nums;}
.blk .bt{font-size:14.5px;font-weight:650;line-height:1.2;}

/* PHASE DETAIL (single phase, 4 blocks with output) */
.pd-blocks{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px;flex:1;}
.pdb{border-radius:14px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);padding:18px 22px;display:flex;flex-direction:column;opacity:0;}
.slide.active .pdb{animation:rise .5s ease both;}
.slide.active .pdb:nth-child(1){animation-delay:.3s;}.slide.active .pdb:nth-child(2){animation-delay:.44s;}
.slide.active .pdb:nth-child(3){animation-delay:.58s;}.slide.active .pdb:nth-child(4){animation-delay:.72s;}
.pdb .pbn{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);}
.pdb .pbh{font-size:19px;font-weight:800;margin-top:5px;letter-spacing:-.01em;}
.pdb .pbq{font-size:14.5px;color:var(--t-mut);line-height:1.4;margin-top:8px;}
.pdb .pbo{margin-top:auto;padding-top:12px;font-size:13px;font-weight:700;color:var(--green);}

/* MS ROLE */
.role{display:flex;flex-direction:column;gap:0;margin-top:26px;flex:1;justify-content:center;}
.rr{display:grid;grid-template-columns:54px 1fr;gap:20px;align-items:center;padding:18px 0;border-top:1px solid var(--line);opacity:0;}
.rr:last-child{border-bottom:1px solid var(--line);}
.slide.active .rr{animation:rise .5s ease both;}
.slide.active .rr:nth-child(1){animation-delay:.3s;}.slide.active .rr:nth-child(2){animation-delay:.44s;}
.slide.active .rr:nth-child(3){animation-delay:.58s;}.slide.active .rr:nth-child(4){animation-delay:.72s;}
.rr .rn{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;
  background:rgba(124,92,255,.18);border:1px solid rgba(124,92,255,.4);color:var(--purple);font-size:20px;font-weight:850;}
.rr .rt{font-size:21px;font-weight:750;}
.rr .rt small{display:block;font-size:15px;font-weight:500;color:var(--t-mut);margin-top:3px;}

/* TIMELINE */
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:40px;flex:1;align-content:center;}
.tlc{position:relative;padding:0 22px;opacity:0;}
.slide.active .tlc{animation:rise .55s ease both;}
.slide.active .tlc:nth-child(1){animation-delay:.3s;}.slide.active .tlc:nth-child(2){animation-delay:.48s;}
.slide.active .tlc:nth-child(3){animation-delay:.66s;}.slide.active .tlc:nth-child(4){animation-delay:.84s;}
.tlc::before{content:"";position:absolute;left:0;top:9px;width:18px;height:18px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 20%,transparent);}
.tlc::after{content:"";position:absolute;left:18px;top:17px;right:0;height:2px;background:var(--line);}
.tlc:last-child::after{display:none;}
.tl-when{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-top:34px;}
.tl-h{font-size:20px;font-weight:750;margin-top:9px;letter-spacing:-.01em;}
.tl-b{font-size:14.5px;color:var(--t-mut);line-height:1.42;margin-top:7px;}

/* CALLOUT */
.callout{margin-top:auto;display:flex;gap:16px;align-items:flex-start;padding:22px 26px;border-radius:16px;
  background:rgba(245,194,75,.08);border:1px solid rgba(245,194,75,.3);border-left:3px solid var(--gold);}
.callout .ci{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);flex:none;padding-top:3px;}
.callout .ct{font-size:18px;font-weight:600;line-height:1.45;}
.callout .ct b{color:#fff;}

/* CLOSE */
.cl-h{font-size:56px;font-weight:850;letter-spacing:-.03em;margin-top:auto;max-width:18ch;line-height:1.03;}
.cl-sub{font-size:20px;color:var(--t-mut);margin-top:18px;max-width:52ch;line-height:1.46;}
.cl-steps{display:flex;gap:0;margin-top:34px;border-top:1px solid var(--line);}
.cl-step{flex:1;padding:22px 22px 4px 0;}
.cl-step .k{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--purple);}
.cl-step .v{font-size:18px;font-weight:650;margin-top:8px;line-height:1.3;}

#hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:99;font:500 12px/1 var(--font);
  color:rgba(255,255,255,.4);background:rgba(0,0,0,.4);padding:7px 13px;border-radius:20px;animation:fade 1s ease 4s forwards;}
@keyframes fade{to{opacity:0;}}
#ov{position:fixed;inset:0;background:#0b0b0d;z-index:80;display:none;overflow:auto;padding:24px;}
#ov.on{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-content:start;}
.ovcell{aspect-ratio:16/9;border-radius:8px;border:1px solid #222;overflow:hidden;position:relative;cursor:pointer;background:#0a1326;color:#cfe0ff;font-size:13px;font-weight:600;padding:24px 10px 0;}
.ovcell:hover{border-color:var(--purple);}
.ovcell .nn{position:absolute;top:6px;left:8px;font-size:10px;color:#5a7099;}

/* MOVEMENT WALL — free-floating person→agents clusters + key-role rail */
.mv-layout{display:grid;grid-template-columns:1fr 300px;gap:20px;margin-top:18px;flex:1;min-height:0;}
.mv-wall{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:10px 8px;align-content:stretch;}
.mvb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;opacity:0;}
.slide.active .mvb{animation:rise .5s ease both;animation-delay:calc(.3s + var(--i) * .04s);}
.mv-net{width:100%;max-width:180px;height:auto;display:block;overflow:visible;}
.mv-tt{display:flex;flex-direction:column;align-items:center;gap:2px;}
.mv-tt .dp{font-size:13px;color:var(--t-on);font-weight:700;letter-spacing:-.01em;}
.mv-tt .ms{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t-dim);font-weight:600;}
.mv-tt .ms .l4{width:11px;height:11px;display:grid;grid-template-columns:1fr 1fr;gap:1.5px;}
.mv-tt .ms .l4 i{display:block;border-radius:1px;}
.mv-tt .ms .l4 i:nth-child(1){background:#F25022;}.mv-tt .ms .l4 i:nth-child(2){background:#7FBA00;}
.mv-tt .ms .l4 i:nth-child(3){background:#00A4EF;}.mv-tt .ms .l4 i:nth-child(4){background:#FFB900;}
.mvb.ghost .dp{color:var(--t-dim);}
.mvb.ghost .ms{opacity:.55;}
/* side rail: the two anchor roles */
.mv-rail{display:flex;flex-direction:column;gap:13px;justify-content:center;border-left:1px solid var(--line);padding-left:22px;}
.mv-rail-h{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t-dim);}
.kr{border-radius:14px;padding:15px 16px;display:flex;align-items:center;gap:14px;opacity:0;position:relative;overflow:hidden;border:1px solid var(--line);}
.slide.active .kr{animation:rise .55s ease both;animation-delay:calc(.5s + var(--i) * .12s);}
.kr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;}
.kr-badge{display:flex;align-items:center;gap:6px;flex:none;}
.kr-badge .kr-ag,.kr-badge .kr-hu{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;}
.kr-badge .kr-ag{color:var(--purple);border:1.5px solid rgba(181,140,255,.55);background:radial-gradient(circle at 50% 40%,rgba(181,140,255,.22),transparent);}
.kr-badge .kr-hu{color:var(--cyan);border:1.5px solid rgba(55,230,201,.55);background:radial-gradient(circle at 50% 40%,rgba(55,230,201,.22),transparent);}
.kr-badge svg{width:19px;height:19px;}
.kr-badge .kr-link{width:12px;height:2px;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:2px;flex:none;}
.kr-role{font-size:15px;font-weight:850;letter-spacing:-.015em;line-height:1.12;}
.kr-sub{font-size:11.5px;color:var(--t-mut);margin-top:3px;line-height:1.3;}
.kr:nth-child(2),.kr:nth-child(3){background:linear-gradient(180deg,rgba(55,230,201,.12),var(--card));border-color:rgba(55,230,201,.42);}
.kr:nth-child(2)::before,.kr:nth-child(3)::before{background:var(--cyan);}
</style></head>
<body>
<div id="stage"></div>
<div id="ov"></div>
<div id="hint">→ / Space &nbsp;next &nbsp;·&nbsp; ← back &nbsp;·&nbsp; F fullscreen &nbsp;·&nbsp; Esc overview</div>
<script>
const FOOT='Agent Boss · ASEAN Innovation Hub · Microsoft';
const brand='<div class="brandbar"><span class="logo4"><i></i><i></i><i></i><i></i></span>Agent Boss Program</div>';
const S=[];

// 1 COVER
S.push({bg:1,accent:'var(--purple)',html:`${brand}<div class="pad">
 <div class="eyebrow r" style="--d:.05s">ASEAN Innovation Hub · For customers</div>
 <div class="cv-title r" style="--d:.18s">Make everyone in your organization an <span class="kw">Agent Boss</span></div>
 <div class="cv-sub r" style="--d:.34s">A learning and transformation engine that turns your teams into agent builders — redesigning workflows, shipping real agents, and building a culture that keeps innovating. Co-designed with Microsoft, run by your people, governed from day one.</div>
 <div class="cv-meta r" style="--d:.5s">
  <div><div class="k">Format</div><div class="v">Learning &amp; transformation · coach-the-coach</div></div>
  <div><div class="k">Outcome</div><div class="v">~6 weeks to working agents</div></div>
  <div><div class="k">Built for</div><div class="v">Frontier organizations</div></div>
 </div>
</div><div class="foot">${FOOT}</div>`});

// 2 THE SHIFT
S.push({bg:1,accent:'var(--purple)',html:`${brand}<div class="pad">
 <div class="kick r" style="--d:.05s">Why now</div>
 <div class="s-title r" style="--d:.14s">Start from the workflow, not the tool</div>
 <div class="shift">
  <div class="shift-col from r" style="--d:.35s"><div class="shift-era">The trap</div><div class="shift-txt">Buy AI licenses, run a training, and hope adoption follows.</div></div>
  <div class="shift-arrow r" style="--d:.9s">→</div>
  <div class="shift-col to r" style="--d:1.2s"><div class="shift-era">Agent Boss</div><div class="shift-txt">Skill your people to <span class="kw">redesign the work</span> and ship the agents themselves.</div></div>
 </div>
</div><div class="foot">${FOOT}</div>`});

// 3 WHAT IT IS
S.push({bg:1,accent:'var(--cyan)',html:`${brand}<div class="pad" style="justify-content:center">
 <div class="kick r" style="--d:.08s">What Agent Boss is</div>
 <div class="s-title r" style="--d:.2s;font-size:46px;max-width:21ch">Our own transformation engine — packaged for you</div>
 <div class="s-sub r" style="--d:.34s;font-size:22px;max-width:58ch">Agent Boss started as how Microsoft skills its <i>own</i> people to build AI agents. This is that same engine, run by your teams, with Microsoft alongside as coach. The goal: make everyone an Agent Boss — and build a system that keeps creating agents long after the first workshop.</div>
</div><div class="foot">${FOOT}</div>`});

// 4 THREE PILLARS
S.push({bg:1,accent:'var(--cyan)',html:`${brand}<div class="pad">
 <div class="kick r" style="--d:.05s">The model</div>
 <div class="s-title r" style="--d:.14s">Three moves, repeated until it's a culture</div>

function cluster(nAgents,ghost,gid){
  const W2=180,H2=84, hx=32, hy=42;            // person (Agent Boss) node anchored left-center
  const r=20, ar=14;                            // person ring radius / agent ring radius
  const axCol=ghost?'rgba(255,255,255,.28)':'var(--purple)';
  const hxCol=ghost?'rgba(255,255,255,.28)':'var(--cyan)';
  const lnCol=ghost?'rgba(255,255,255,.30)':`url(#${gid})`;   // ghost = solid grey, else cyan→purple
  const dash=ghost?' stroke-dasharray="3 3"':'';
  // single agent sits close; 2-3 agents fan out evenly around the person's height
  const ax = nAgents===1 ? 102 : 130;
  const ys = nAgents===1?[hy] : nAgents===2?[24,60] : [16,42,68];
  let links='', nodes='';
  ys.forEach(ay=>{

    nodes+=`<g transform="translate(${ax} ${ay})"><circle r="${ar}" fill="${ghost?'none':'rgba(181,140,255,.10)'}" stroke="${axCol}" stroke-width="1.7"${dash}/><g style="color:${axCol}" transform="scale(.98)">${gAgent}</g></g>`;
  });
  return `<svg class="mv-net" viewBox="0 0 ${W2} ${H2}" role="img">

    ${nodes}
  </svg>`;
}

const slides=[...document.querySelectorAll('.slide')];
let idx=0;
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);document.documentElement.style.setProperty('--fit',s);}
function show(n){idx=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((sl,k)=>{if(k===idx){sl.classList.remove('active');void sl.offsetWidth;sl.classList.add('active');}else sl.classList.remove('active');});
  if(history.replaceState)history.replaceState(null,'','#'+(idx+1));}
function go(d){show(idx+d);}
function toggleFS(){if(!document.fullscreenElement){(document.documentElement.requestFullscreen||function(){}).call(document.documentElement);}else document.exitFullscreen();}
const ov=document.getElementById('ov');
function overview(on){if(on){ov.innerHTML='';slides.forEach((sl,k)=>{const c=document.createElement('div');c.className='ovcell';
  const t=(sl.querySelector('.cv-title,.s-title,.cl-h')||{}).textContent||('Slide '+(k+1));
  c.innerHTML=`<span class="nn">${k+1}</span>${t.slice(0,46)}`;c.onclick=()=>{ov.classList.remove('on');show(k);};ov.appendChild(c);});
  ov.classList.add('on');}else ov.classList.remove('on');}
addEventListener('keydown',e=>{
  if(ov.classList.contains('on')){if(e.key==='Escape')overview(false);return;}
  switch(e.key){
    case 'ArrowRight':case ' ':case 'PageDown':go(1);e.preventDefault();break;
    case 'ArrowLeft':case 'PageUp':go(-1);e.preventDefault();break;
    case 'Home':show(0);break;case 'End':show(slides.length-1);break;
    case 'f':case 'F':toggleFS();break;case 'Escape':overview(true);break;
    default:if(e.key>='1'&&e.key<='9'){const n=+e.key-1;if(n<slides.length)show(n);}
  }});
addEventListener('click',e=>{if(ov.classList.contains('on'))return;if(e.target.closest('a'))return;
  if(e.clientX<innerWidth*0.22)go(-1);else if(e.clientX>innerWidth*0.5)go(1);});
addEventListener('resize',fit);
const start=Math.max(0,(parseInt(location.hash.slice(1),10)||1)-1);
fit();show(start);
